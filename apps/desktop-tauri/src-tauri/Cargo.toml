[package]
name = "zennotes-tauri"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSDictionary"] }
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation", "NSGraphics", "NSWindow", "NSResponder", "NSView"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "objc2-app-kit"] }
